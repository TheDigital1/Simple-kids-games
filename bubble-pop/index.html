<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubble Pop</title>
<meta name="description" content="Pop as many bubbles as you can in one minute! A bunny blows them for you.">
<meta name="theme-color" content="#bfe6ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d2452" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bubble Pop">
<style>
  :root {
    --bg: #bfe6ff;
    --hud-bg: rgba(255, 255, 255, 0.72);
    --hud-fg: #2b2260;
    --card-bg: #ffffff;
    --card-fg: #2b2260;
    --muted: rgba(43, 34, 96, 0.7);
    --accent: #ff4f9a;
    --accent-dark: #c62f74;
    --low: #e0245e;
    --mode: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d2452; --hud-bg: rgba(20, 16, 54, 0.6); --hud-fg: #f1ecff;
      --card-bg: #251d5c; --card-fg: #f1ecff; --muted: rgba(241, 236, 255, 0.75);
      --low: #ff6b96; --mode: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d2452; --hud-bg: rgba(20, 16, 54, 0.6); --hud-fg: #f1ecff;
    --card-bg: #251d5c; --card-fg: #f1ecff; --muted: rgba(241, 236, 255, 0.75);
    --low: #ff6b96; --mode: dark;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  [hidden] { display: none !important; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-right, 0px) + 14px) 0 calc(env(safe-area-inset-left, 0px) + 14px);
    pointer-events: none;
  }
  .pill {
    background: var(--hud-bg); color: var(--hud-fg);
    border-radius: 999px; font-weight: 800;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: 0 2px 10px rgba(30, 20, 80, 0.12);
  }
  #timer {
    justify-self: start; display: flex; align-items: center; gap: 8px;
    padding: 10px 16px 10px 12px; font-size: 22px; font-variant-numeric: tabular-nums;
  }
  #timer svg { width: 26px; height: 26px; flex: none; }
  #timer.low { color: var(--low); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.1); } }
  #score {
    display: flex; flex-direction: column; align-items: center;
    padding: 6px 26px 10px; min-width: 70px;
  }
  #score small { font-size: 12px; letter-spacing: 0.14em; opacity: 0.75; }
  #scoreNum { font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
  #scoreNum.bump { animation: bump 0.25s ease-out; }
  @keyframes bump { 40% { transform: scale(1.3); } }
  #sound {
    justify-self: end; pointer-events: auto; cursor: pointer; border: 0;
    font-size: 22px; line-height: 1; padding: 11px 13px;
  }
  #sound:focus-visible, .play:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: rgba(25, 15, 70, 0.22);
  }
  .card {
    background: var(--card-bg); color: var(--card-fg);
    border-radius: 28px; padding: 28px 24px 30px; width: 100%; max-width: 360px;
    text-align: center; box-shadow: 0 18px 50px rgba(20, 10, 60, 0.3);
  }
  .card h1, .card h2 { margin: 0 0 8px; font-size: 38px; line-height: 1.1; }
  .card p { margin: 0; font-size: 18px; line-height: 1.4; color: var(--muted); }
  .big { font-size: 72px; font-weight: 900; line-height: 1; color: var(--accent); margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
  #best { margin-top: 10px; font-weight: 700; }
  .play {
    font: 800 26px/1 "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: #fff; background: var(--accent); border: 0; border-radius: 999px;
    padding: 18px 44px; margin-top: 22px; cursor: pointer;
    box-shadow: 0 6px 0 var(--accent-dark);
  }
  .play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dark); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="timer" class="pill" role="timer" aria-label="Time left">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M12 13V8.5M9.5 2.5h5M12 2.5v2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    <span id="timeText">1:00</span>
  </div>
  <div id="score" class="pill" aria-live="polite"><small>SCORE</small><span id="scoreNum">0</span></div>
  <button id="sound" class="pill" type="button" aria-label="Turn sound off">🔊</button>
</div>

<div id="startScreen" class="overlay">
  <div class="card">
    <h1>Bubble Pop</h1>
    <p>Bunny blows bubbles. Pop as many as you can in one minute!</p>
    <button class="play" id="startBtn" type="button">Play ▶</button>
  </div>
</div>

<div id="endScreen" class="overlay" hidden>
  <div class="card">
    <h2>Time's up!</h2>
    <p>You popped</p>
    <div class="big" id="finalScore">0</div>
    <p>bubbles</p>
    <p id="best"></p>
    <button class="play" id="againBtn" type="button">Play again ▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

const GAME_TIME = 60;                  // seconds
const WAVES = [1, 4, 8];               // bubbles per round; stays at 8 after that
let W, H, dpr, M, groundY, playTop;

// =====================================================================
// Sound effects, made on the fly with the Web Audio API
// =====================================================================
const Sfx = (() => {
  let ac = null, master = null, noiseBuf = null;
  let on = true;
  try { on = localStorage.getItem('bubblepop-sound') !== 'off'; } catch (e) {}

  function start() {                           // browsers only allow audio after a tap
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor();
    master = ac.createGain();
    master.gain.value = on ? 0.6 : 0;
    master.connect(comp); comp.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const ready = () => ac && on && ac.state === 'running';

  function tone(freq, freqEnd, dur, vol, type = 'sine', delay = 0) {
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd !== freq) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, type, f0, f1, delay = 0, q = 1, attack = 0.005) {
    const t = ac.currentTime + delay;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  }

  return {
    start,
    get on() { return on; },
    toggle() {
      on = !on;
      try { localStorage.setItem('bubblepop-sound', on ? 'on' : 'off'); } catch (e) {}
      if (master) master.gain.setTargetAtTime(on ? 0.6 : 0, ac.currentTime, 0.05);
      return on;
    },
    pop(size) {                                // smaller bubbles pop higher
      if (!ready()) return;
      const f = (1300 - size * 600) * (0.85 + Math.random() * 0.3);
      tone(f, f * 2.2, 0.07, 0.3, 'sine');
      noise(0.05, 0.35, 'bandpass', 3500, 1500, 0, 1.2);
    },
    blow() {                                   // soft breath while the bubble grows
      if (!ready()) return;
      noise(0.4, 0.07, 'bandpass', 500, 900, 0, 0.8, 0.12);
    },
    release() {                                // little "bloop" as it floats off
      if (!ready()) return;
      tone(260, 520, 0.12, 0.12, 'sine');
    },
    start1() {
      if (!ready()) return;
      [523, 659, 784].forEach((f, i) => tone(f, f, 0.25, 0.14, 'triangle', i * 0.09));
    },
    tick() {
      if (!ready()) return;
      tone(1500, 1500, 0.04, 0.08, 'square');
    },
    fanfare() {
      if (!ready()) return;
      [523, 659, 784, 1047].forEach((f, i) => tone(f, f, i === 3 ? 0.6 : 0.2, 0.16, 'triangle', i * 0.13));
    },
  };
})();

// =====================================================================
// Theme and background
// =====================================================================
let dark = false;
const bg = document.createElement('canvas');
const bgCtx = bg.getContext('2d');

function readTheme() {
  dark = getComputedStyle(document.documentElement).getPropertyValue('--mode').trim() === 'dark';
  if (W) paintBackground();
}

// Sky, clouds and a grassy hill, painted once per resize
function paintBackground() {
  bg.width = canvas.width; bg.height = canvas.height;
  const g = bgCtx;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sky = g.createLinearGradient(0, 0, 0, groundY);
  if (dark) { sky.addColorStop(0, '#1d2452'); sky.addColorStop(1, '#4a3a7a'); }
  else      { sky.addColorStop(0, '#9fd8ff'); sky.addColorStop(1, '#fff1fb'); }
  g.fillStyle = sky; g.fillRect(0, 0, W, H);

  // Sun or moon
  const sx = W * 0.14, sy = Math.max(playTop + M * 0.08, H * 0.2), sr = M * 0.07;
  if (dark) {
    g.save();                                  // crescent: the moon disc minus a smaller offset disc
    g.beginPath(); g.arc(sx, sy, sr, 0, Math.PI * 2); g.clip();
    g.beginPath(); g.rect(sx - sr, sy - sr, sr * 2, sr * 2);
    g.arc(sx + sr * 0.45, sy - sr * 0.25, sr * 0.85, 0, Math.PI * 2);
    g.fillStyle = '#fff6d6'; g.fill('evenodd');
    g.restore();
    let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    g.fillStyle = 'rgba(255, 255, 255, 0.8)';
    for (let i = 0; i < 40; i++) { g.beginPath(); g.arc(rnd() * W, rnd() * groundY * 0.8, 0.6 + rnd() * 1.3, 0, Math.PI * 2); g.fill(); }
  } else {
    const glow = g.createRadialGradient(sx, sy, sr * 0.5, sx, sy, sr * 2.6);
    glow.addColorStop(0, 'rgba(255, 236, 140, 0.7)'); glow.addColorStop(1, 'rgba(255, 236, 140, 0)');
    g.fillStyle = glow; g.fillRect(sx - sr * 3, sy - sr * 3, sr * 6, sr * 6);
    g.fillStyle = '#ffe170'; g.beginPath(); g.arc(sx, sy, sr, 0, Math.PI * 2); g.fill();
  }

  // Clouds
  g.fillStyle = dark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(255, 255, 255, 0.85)';
  const cloud = (x, y, s) => {                 // one path so see-through clouds don't darken where puffs overlap
    g.beginPath();
    for (const [dx, dy, r] of [[0, 0, 1], [0.9, 0.15, 0.75], [-0.9, 0.2, 0.7], [0.35, -0.45, 0.75]]) {
      g.moveTo(x + (dx + r) * s, y + dy * s); g.arc(x + dx * s, y + dy * s, r * s, 0, Math.PI * 2);
    }
    g.fill();
  };
  cloud(W * 0.55, playTop + H * 0.1, M * 0.05);
  cloud(W * 0.86, playTop + H * 0.22, M * 0.035);
  cloud(W * 0.3, playTop + H * 0.3, M * 0.03);

  // Back hill, front hill
  const hill = (y0, amp, color, phase) => {
    g.fillStyle = color; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + 10; x += 10) g.lineTo(x, y0 + Math.sin(x / (W * 0.25) + phase) * amp);
    g.lineTo(W, H); g.closePath(); g.fill();
  };
  hill(groundY - M * 0.05, M * 0.03, dark ? '#2f5a4a' : '#9ad97a', 1.2);
  hill(groundY, M * 0.015, dark ? '#264d3f' : '#6fc35a', 0.2);

  // Flowers
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const petals = dark ? ['#c9a8ff', '#ff9ec4', '#fff2a8'] : ['#ff7aa8', '#ffd23f', '#ffffff', '#b98cff'];
  for (let i = 0; i < Math.round(W / 45); i++) {
    const x = rnd() * W, y = groundY + 8 + rnd() * (H - groundY - 14), s = M * (0.007 + rnd() * 0.005);
    g.fillStyle = petals[i % petals.length];
    for (let k = 0; k < 5; k++) {
      const a = k * Math.PI * 0.4;
      g.beginPath(); g.arc(x + Math.cos(a) * s, y + Math.sin(a) * s, s * 0.8, 0, Math.PI * 2); g.fill();
    }
    g.fillStyle = '#ffb23f'; g.beginPath(); g.arc(x, y, s * 0.6, 0, Math.PI * 2); g.fill();
  }
}

// =====================================================================
// The bunny (unit space: 200 units tall-ish, origin between the feet, facing left)
// =====================================================================
// <bunny>
const RING = { x: -92, y: -114, r: 17 };       // the bubble wand's loop, in bunny units
function drawBunny(g, x, y, size, st) {
  g.save();
  g.translate(x, y); g.scale(size / 200, size / 200);
  g.lineJoin = 'round'; g.lineCap = 'round';
  const fur = '#fffaf6', line = '#c4afd3', innerEar = '#ffc9d9';
  const ell = (ex, ey, rx, ry, rot = 0) => { g.beginPath(); g.ellipse(ex, ey, rx, ry, rot, 0, Math.PI * 2); };
  const furry = () => { g.fillStyle = fur; g.fill(); g.strokeStyle = line; g.lineWidth = 4; g.stroke(); };

  ell(52, -40, 15, 15); furry();                       // tail
  ell(22, -9, 36, 12); furry();                        // back foot
  ell(4, -58, 50, 54); furry();                        // body
  g.fillStyle = '#ffffff'; ell(-14, -50, 26, 34); g.fill();

  // Back ear (flops a little), then head, then front ear
  g.save(); g.translate(12, -158); g.rotate(0.38 + st.ear * 0.18);
  ell(0, -34, 12, 38); furry(); g.fillStyle = innerEar; ell(0, -32, 6, 27); g.fill();
  g.restore();
  ell(-20, -128, 42, 38); furry();
  g.save(); g.translate(-12, -160); g.rotate(-0.12 - st.ear * 0.08);
  ell(0, -36, 13, 40); furry(); g.fillStyle = innerEar; ell(0, -34, 6.5, 29); g.fill();
  g.restore();

  // Eye
  if (st.blink) {
    g.strokeStyle = '#3a2a4a'; g.lineWidth = 3.5;
    g.beginPath(); g.arc(-38, -138, 7, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
  } else {
    g.fillStyle = '#3a2a4a'; ell(-38, -136, 6.5, 7.5); g.fill();
    g.fillStyle = '#ffffff'; ell(-40, -139, 2.3, 2.3); g.fill();
  }
  g.fillStyle = 'rgba(255, 130, 165, 0.45)'; ell(-28, -113, 9, 6); g.fill();   // blush

  // Puffed cheek while blowing
  if (st.puff > 0.05) {
    ell(-50, -113, 7 + 8 * st.puff, 7 + 7 * st.puff); furry();
  }
  // Nose
  g.fillStyle = '#ff8fb1';
  g.beginPath(); g.moveTo(-62, -126); g.lineTo(-54, -128); g.lineTo(-58, -121); g.closePath(); g.fill();
  // Mouth: little "o" while blowing, smile otherwise
  if (st.puff > 0.25) {
    g.fillStyle = '#8a3556'; ell(-62, -112, 2.5 + 2 * st.puff, 3 + 2 * st.puff); g.fill();
  } else {
    g.strokeStyle = '#8a3556'; g.lineWidth = 3;
    g.beginPath(); g.arc(-58, -116, 5, 0.2 * Math.PI, 0.9 * Math.PI); g.stroke();
  }
  // Whiskers
  g.strokeStyle = 'rgba(150, 120, 170, 0.6)'; g.lineWidth = 2;
  for (const [x1, y1, x2, y2] of [[-50, -122, -26, -127], [-50, -118, -25, -116]]) {
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  }

  ell(-28, -7, 20, 9); furry();                        // front foot

  // Bubble wand: stick from the paw to the loop in front of the mouth
  g.strokeStyle = '#8a5cd6'; g.lineWidth = 6;
  g.beginPath(); g.moveTo(-38, -66); g.lineTo(-79, -103); g.stroke();
  g.strokeStyle = '#ffc93c'; g.lineWidth = 5.5;
  g.beginPath(); g.arc(RING.x, RING.y, RING.r, 0, Math.PI * 2); g.stroke();
  ell(-38, -68, 12, 10); furry();                      // paw on the stick
  g.restore();
}
// </bunny>

const bunny = { x: 0, y: 0, size: 160, puff: 0, blinkIn: 2, blink: 0, hop: 0 };
function ringPos() {
  const k = bunny.size / 200;
  return { x: bunny.x + RING.x * k, y: bunny.y + bunnyHopY() + RING.y * k, r: RING.r * k };
}
const bunnyHopY = () => bunny.hop > 0 ? -Math.sin(Math.PI * (1 - bunny.hop / 0.45)) * bunny.size * 0.12 : 0;

// =====================================================================
// Layout
// =====================================================================
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  M = Math.min(W, H);
  groundY = H - Math.max(46, H * 0.11);
  playTop = $('hud').getBoundingClientRect().bottom + 6;
  bunny.size = Math.max(110, Math.min(240, M * 0.32));
  bunny.x = W - bunny.size * 0.36 - 8;
  bunny.y = groundY + bunny.size * 0.04;
  paintBackground();
}

// =====================================================================
// Bubbles: they drift on gentle "breezes", push each other apart, and get
// shoved outward when a neighbor pops.
// =====================================================================
const bubbles = [];
const particles = [];
let blowQueue = 0, blowCooldown = 0, growing = null;
let wave = 0, nextWaveIn = 0;

function bubbleSize() {
  const n = WAVES[Math.min(wave, WAVES.length - 1)];
  const base = n === 1 ? 0.12 : n <= 4 ? 0.095 : 0.078;
  return Math.max(30, Math.min(105, M * base * (0.88 + Math.random() * 0.24)));
}

function startBlowing() {
  growing = {
    x: 0, y: 0, vx: 0, vy: 0, r: 0, target: bubbleSize(), grow: 0,
    growTime: wave === 0 ? 0.8 : 0.4,
    hue: Math.random() * 360, wob: 0, leaving: false,
    p: [0, 1, 2, 3, 4].map(() => Math.random() * Math.PI * 2),
    f: [0.4 + Math.random() * 0.4, 0.8 + Math.random() * 0.5],
  };
  bubbles.push(growing);
  Sfx.blow();
}

function releaseGrowing() {
  const b = growing, u = M / 700;
  b.vx = -(140 + Math.random() * 220) * u;
  b.vy = -(90 + Math.random() * 200) * u;
  growing = null;
  blowQueue--;
  blowCooldown = 0.15;
  Sfx.release();
}

function updateBubbles(dt, t) {
  const u = M / 700;

  // The bubble on the wand grows, then floats away
  if (growing) {
    const b = growing, ring = ringPos();
    b.grow = Math.min(1, b.grow + dt / b.growTime);
    b.r = b.target * (1 - Math.pow(1 - b.grow, 2));
    const out = Math.max(0, b.r - ring.r * 0.7);
    b.x = ring.x - out; b.y = ring.y - out * 0.35;
    if (b.grow >= 1) releaseGrowing();
  } else if (blowQueue > 0 && running) {
    blowCooldown -= dt;
    if (blowCooldown <= 0) startBlowing();
  }

  const left = 6, right = W - 6, top = playTop, bottom = groundY - 4;
  for (const b of bubbles) {
    if (b === growing) continue;
    // Breeze: a few slow waves, different for every bubble
    let fx = (Math.sin(t * b.f[0] + b.p[0]) + 0.5 * Math.sin(t * b.f[1] + b.p[1])) * 42 * u;
    let fy = (Math.cos(t * b.f[0] * 0.8 + b.p[2]) + 0.5 * Math.sin(t * b.f[1] * 1.1 + b.p[3])) * 32 * u - 6 * u;
    if (b.leaving) fy -= 260 * u;
    // Soft walls: bubbles bounce gently off the edges
    if (b.x - b.r < left)  fx += (left - (b.x - b.r)) * 30;
    if (b.x + b.r > right) fx -= ((b.x + b.r) - right) * 30;
    if (!b.leaving && b.y - b.r < top) fy += (top - (b.y - b.r)) * 30;
    if (b.y + b.r > bottom) fy -= ((b.y + b.r) - bottom) * 30;
    b.vx += fx * dt; b.vy += fy * dt;
  }

  // Bubbles nudge each other apart instead of overlapping
  for (let i = 0; i < bubbles.length; i++) {
    const a = bubbles[i];
    for (let j = i + 1; j < bubbles.length; j++) {
      const b = bubbles[j];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01;
      const overlap = a.r + b.r + 4 - d;
      if (overlap > 0) {
        const push = overlap * 18 * dt, nx = dx / d, ny = dy / d;
        if (a !== growing) { a.vx -= nx * push; a.vy -= ny * push; }
        if (b !== growing) { b.vx += nx * push; b.vy += ny * push; }
        a.wob = Math.min(0.12, a.wob + overlap * 0.0008);
        b.wob = Math.min(0.12, b.wob + overlap * 0.0008);
      }
    }
  }

  const drag = Math.exp(-0.9 * dt), maxV = 900 * u;
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.wob *= Math.exp(-2.5 * dt);
    if (b === growing) continue;
    b.vx *= drag; b.vy *= drag;
    const v = Math.hypot(b.vx, b.vy);
    if (v > maxV) { b.vx *= maxV / v; b.vy *= maxV / v; }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.leaving && b.y + b.r < -20) bubbles.splice(i, 1);
  }
}

function popBubble(b, scored) {
  const i = bubbles.indexOf(b);
  if (i < 0) return;
  bubbles.splice(i, 1);
  if (b === growing) { growing = null; blowQueue--; blowCooldown = 0.25; }
  Sfx.pop(Math.min(1, b.r / 100));

  // Shove the neighbors away; closer ones get pushed harder and wobble
  const u = M / 700, reach = b.r * 2 + 240 * u;
  for (const o of bubbles) {
    if (o === growing) continue;
    const dx = o.x - b.x, dy = o.y - b.y, d = Math.hypot(dx, dy) || 0.01;
    if (d >= reach) continue;
    const k = Math.pow(1 - d / reach, 1.5);
    o.vx += (dx / d) * 520 * u * k;
    o.vy += (dy / d) * 520 * u * k;
    o.wob = Math.min(0.2, o.wob + 0.18 * k);
  }

  // Sparkly spray, a ring, and a "+1"
  particles.push({ kind: 'ring', x: b.x, y: b.y, r: b.r, life: 1, hue: b.hue });
  const n = 10 + (b.r / 8 | 0);
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, s = (120 + Math.random() * 260) * u;
    particles.push({
      kind: 'drop', x: b.x + Math.cos(a) * b.r * 0.9, y: b.y + Math.sin(a) * b.r * 0.9,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, r: 1.5 + Math.random() * 2.5,
      hue: (b.hue + Math.random() * 120) % 360,
    });
  }
  if (scored) particles.push({ kind: 'text', x: b.x, y: b.y, vy: -70 * u, life: 1 });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.kind === 'ring') p.life -= dt * 3.5;
    else if (p.kind === 'drop') {
      p.life -= dt * 1.8;
      p.vy += 500 * dt;
      p.vx *= Math.exp(-2 * dt); p.vy *= Math.exp(-1 * dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
    } else { p.life -= dt * 1.2; p.y += p.vy * dt; }
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// =====================================================================
// Drawing
// =====================================================================
const hasConic = typeof ctx.createConicGradient === 'function';

function drawBubble(b, t) {
  const r = b.r;
  if (r < 1) return;
  ctx.save();
  ctx.translate(b.x, b.y);
  // Wobble: squash and stretch along the direction it's moving
  const w = b.wob * Math.sin(t * 12 + b.p[4]);
  const ang = Math.atan2(b.vy, b.vx);
  ctx.rotate(ang); ctx.scale(1 + w, 1 - w); ctx.rotate(-ang);

  const body = ctx.createRadialGradient(-r * 0.25, -r * 0.3, r * 0.1, 0, 0, r);
  body.addColorStop(0, 'rgba(255, 255, 255, 0.04)');
  body.addColorStop(0.7, `hsla(${b.hue}, 90%, 85%, ${dark ? 0.12 : 0.1})`);
  body.addColorStop(1, `hsla(${b.hue}, 90%, ${dark ? 80 : 75}%, ${dark ? 0.45 : 0.38})`);
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();

  // Rainbow sheen around the edge, slowly turning
  let rim;
  const a0 = t * 0.6 + b.p[0];
  if (hasConic) {
    rim = ctx.createConicGradient(a0, 0, 0);
    for (let k = 0; k <= 6; k++) rim.addColorStop(k / 6, `hsla(${(b.hue + k * 60) % 360}, 95%, 70%, ${dark ? 0.85 : 0.7})`);
  } else {
    rim = ctx.createLinearGradient(-r, -r, r, r);
    rim.addColorStop(0, `hsla(${b.hue}, 95%, 70%, 0.75)`);
    rim.addColorStop(1, `hsla(${(b.hue + 180) % 360}, 95%, 70%, 0.75)`);
  }
  ctx.strokeStyle = rim; ctx.lineWidth = Math.max(2, r * 0.07);
  ctx.beginPath(); ctx.arc(0, 0, r - ctx.lineWidth / 2, 0, Math.PI * 2); ctx.stroke();

  // Shine
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.beginPath(); ctx.ellipse(-r * 0.4, -r * 0.42, r * 0.24, r * 0.12, -0.75, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-r * 0.12, -r * 0.62, r * 0.05, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)'; ctx.lineWidth = Math.max(1.5, r * 0.05);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.76, 0.12 * Math.PI, 0.5 * Math.PI); ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    if (p.kind === 'ring') {
      ctx.strokeStyle = `hsla(${p.hue}, 90%, ${dark ? 85 : 70}%, ${p.life})`;
      ctx.lineWidth = 3 * p.life + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + (1 - p.life) * 0.6), 0, Math.PI * 2); ctx.stroke();
    } else if (p.kind === 'drop') {
      ctx.fillStyle = `hsla(${p.hue}, 90%, ${dark ? 85 : 65}%, ${p.life})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.globalAlpha = Math.min(1, p.life * 1.5);
      ctx.font = `900 ${Math.round(M * 0.06)}px "Trebuchet MS", system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 5; ctx.strokeStyle = dark ? '#251d5c' : '#ffffff';
      ctx.strokeText('+1', p.x, p.y); ctx.fillStyle = '#ff4f9a'; ctx.fillText('+1', p.x, p.y);
      ctx.globalAlpha = 1;
    }
  }
}

// =====================================================================
// Game flow
// =====================================================================
let running = false, timeLeft = GAME_TIME, score = 0, lastTick = 0;
let best = 0;
try { best = +localStorage.getItem('bubblepop-best') || 0; } catch (e) {}

const scoreEl = $('scoreNum'), timerEl = $('timer'), timeText = $('timeText');
function showScore() {
  scoreEl.textContent = score;
  scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
}
function showTime() {
  const s = Math.ceil(timeLeft);
  timeText.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  timerEl.classList.toggle('low', running && s <= 10);
}

function startGame() {
  Sfx.start(); Sfx.start1();
  for (const b of bubbles.slice()) popBubble(b, false);
  bubbles.length = 0; growing = null;
  score = 0; timeLeft = GAME_TIME; wave = 0; lastTick = 0;
  scoreEl.textContent = '0';
  running = true;
  blowQueue = WAVES[0]; blowCooldown = 0.5;
  $('startScreen').hidden = true; $('endScreen').hidden = true;
  showTime();
}

function endGame() {
  running = false; timeLeft = 0; showTime();
  blowQueue = 0;
  if (growing) { const b = growing; releaseGrowing(); blowQueue = 0; b.vx *= 0.3; }
  for (const b of bubbles) b.leaving = true;           // leftovers float away
  Sfx.fanfare();
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('bubblepop-best', best); } catch (e) {} }
  $('finalScore').textContent = score;
  $('best').textContent = isBest && score > 0 ? '⭐ New best score! ⭐' : `Best: ${best}`;
  bunny.hop = 0.45;
  setTimeout(() => { $('endScreen').hidden = false; $('againBtn').focus({ preventScroll: true }); }, 700);
}

function updateGame(dt) {
  if (!running) return;
  timeLeft -= dt;
  const s = Math.ceil(timeLeft);
  if (s <= 5 && s > 0 && s !== lastTick) { lastTick = s; Sfx.tick(); }
  if (timeLeft <= 0) { endGame(); return; }
  showTime();

  // All popped? Bunny hops, then blows the next round
  if (blowQueue === 0 && !growing && bubbles.length === 0) {
    if (nextWaveIn <= 0) { nextWaveIn = 0.6; bunny.hop = 0.45; }
    nextWaveIn -= dt;
    if (nextWaveIn <= 0) {
      wave++;
      blowQueue = WAVES[Math.min(wave, WAVES.length - 1)];
      blowCooldown = 0;
    }
  } else nextWaveIn = 0;
}

// =====================================================================
// Main loop
// =====================================================================
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const t = now / 1000;

  updateGame(dt);
  updateBubbles(dt, t);
  updateParticles(dt);

  bunny.puff += ((growing ? 1 : 0) - bunny.puff) * (1 - Math.exp(-12 * dt));
  bunny.blinkIn -= dt; bunny.blink -= dt;
  if (bunny.blinkIn <= 0) { bunny.blink = 0.14; bunny.blinkIn = 2 + Math.random() * 3; }
  if (bunny.hop > 0) bunny.hop = Math.max(0, bunny.hop - dt);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Ground shadow under the bunny
  ctx.fillStyle = 'rgba(30, 60, 20, 0.18)';
  ctx.beginPath(); ctx.ellipse(bunny.x, bunny.y - 2, bunny.size * 0.42, bunny.size * 0.05, 0, 0, Math.PI * 2); ctx.fill();
  drawBunny(ctx, bunny.x, bunny.y + bunnyHopY(), bunny.size, {
    puff: bunny.puff, blink: bunny.blink > 0,
    ear: Math.sin(t * 1.7) * 0.5 + (bunny.hop > 0 ? 1 : 0),
  });
  for (const b of bubbles) drawBubble(b, t);
  drawParticles();
}

// =====================================================================
// Input
// =====================================================================
canvas.addEventListener('pointerdown', e => {
  if (!running) return;
  Sfx.start();
  const x = e.clientX, y = e.clientY;
  // Pick the bubble under the finger; the hit area is a bit bigger than the bubble for small hands
  let hit = null, bestD = Infinity;
  for (const b of bubbles) {
    const d = Math.hypot(x - b.x, y - b.y), pad = Math.max(14, b.r * 0.25);
    if (d < b.r + pad && d / b.r < bestD) { hit = b; bestD = d / b.r; }
  }
  if (!hit) return;
  popBubble(hit, true);
  score++;
  showScore();
});

const soundBtn = $('sound');
const showSound = () => {
  soundBtn.textContent = Sfx.on ? '🔊' : '🔇';
  soundBtn.setAttribute('aria-label', Sfx.on ? 'Turn sound off' : 'Turn sound on');
};
showSound();
soundBtn.addEventListener('click', () => { Sfx.start(); Sfx.toggle(); showSound(); });
$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);

readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', readTheme);
new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
addEventListener('resize', resize);
resize();
showTime();
requestAnimationFrame(frame);

// Install as an app and play offline (only works when served over https or localhost)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
